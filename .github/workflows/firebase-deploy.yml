name: Deploy to Firebase Hosting on Push

on:
  push:
    branches:
      - main
  # Enable once the Instagram secrets exist, to refresh the feed daily (see docs/redesign-plan.md, phase 7):
  # schedule:
  #   - cron: "30 0 * * *"

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: npm ci

      - name: Build Project
        run: npm run build
        env:
          # Optional: build-time Instagram feed. Empty if the secrets are not set, then local images are used.
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: "${{ secrets.GITHUB_TOKEN }}"
          firebaseServiceAccount: "${{ secrets.FIREBASE_SERVICE_ACCOUNT }}"
          channelId: "live"
          projectId: mohak-the-vibe