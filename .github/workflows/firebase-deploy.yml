name: Deploy to Firebase Hosting on Push

on:
  push:
    branches:
      - main
  # Rebuild every 3 hours so product edits in the Google Sheet go live without a code push
  schedule:
    - cron: "15 */3 * * *"
  # "Run workflow" button in the GitHub Actions tab: use it to publish sheet changes right away
  workflow_dispatch:

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: npm ci

      - name: Build Project
        run: npm run build
        env:
          # Product catalog: published Google Sheet CSV. If the secret is missing, the built-in fallback products are used.
          CATALOG_SHEET_CSV_URL: ${{ secrets.CATALOG_SHEET_CSV_URL }}
          # Optional: build-time Instagram feed. Empty if the secrets are not set, then local images are used.
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: "${{ secrets.GITHUB_TOKEN }}"
          firebaseServiceAccount: "${{ secrets.FIREBASE_SERVICE_ACCOUNT }}"
          channelId: "live"
          projectId: mohak-the-vibe